# Seerr : demandes de films/séries, exposé par traefik sur demande.cineplex.fr.
services:
  seerr:
    image: seerr/seerr:v3.4.1
    init: true
    container_name: seerr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: Europe/Paris
      PORT: 5055
    volumes:
      # Chemin absolu sur l'hôte, hors du clone git (sinon perdu au redéploiement)
      - ${SEER_HOST_DIR:?SEER_HOST_DIR non défini}/data:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      # Nom réel du réseau créé par le projet traefik
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.seerr.rule=Host(`demande.cineplex.fr`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.routers.seerr.tls=true"
      - "traefik.http.routers.seerr.tls.certresolver=ovh-resolver"
      - "traefik.http.services.seerr-service.loadbalancer.server.port=5055"

networks:
  traefik_proxy:
    external: true
