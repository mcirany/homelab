# Agent Portabase de srvfr01 : exécute les sauvegardes demandées par le dashboard
# (apps/portabase) et les envoie vers le stockage configuré dans le dashboard.
# Adapté de https://portabase.io/docs/installation/docker (onglet Agent).
# Secret (EDGE_KEY) dans secrets.enc.env, chiffré SOPS : clé créée dans le dashboard,
# Organisation > Settings > Agents. À déployer après le dashboard (voir README).
#
# Projet séparé du dashboard : l'agent rejoint les réseaux des apps à sauvegarder, où un
# service s'appelle déjà "db" (sure), comme la base du dashboard.
#
# Sources à sauvegarder : toutes déclarées dans le dashboard (page de l'agent > Add
# database), rien dans le repo (pas de databases.json, ni mot de passe).
# - PostgreSQL de silo et de sure :
#     silo : hôte postgres, port 5432, base silo, utilisateur silo
#     sure : hôte db, port 5432, base sure_production, utilisateur sure
# - Actual Budget : dossier de données monté dans /sqlite-data/actual
#     type Files  : chemin /sqlite-data/actual (tout : comptes et budgets)
#     type SQLite : chemin /sqlite-data/actual/server-files/account.sqlite (comptes seuls)

x-host-path: &host-path
  type: bind
  bind:
    # Erreur si le dossier n'existe pas, au lieu de démarrer sur un dossier vide
    create_host_path: false

services:
  agent:
    image: portabase/agent:1.27.0
    restart: unless-stopped
    env_file: secrets.enc.env
    environment:
      TZ: Europe/Paris
      POLLING: 5
      APP_ENV: production
      LOG: info
    volumes:
      # Données d'Actual Budget (même dossier hôte que apps/actual). Lecture-écriture :
      # la restauration réécrit les fichiers.
      - <<: *host-path
        source: ${ACTUAL_HOST_DIR:?ACTUAL_HOST_DIR non défini}/data
        target: /sqlite-data/actual
      # Données internes de l'agent (DATA_PATH)
      - agent-data:/data
    extra_hosts:
      # Doc officielle : permet de joindre les services de l'hôte via "localhost"
      - "localhost:host-gateway"
      # Le dashboard est joint par son URL publique (inscrite dans l'Edge Key) : on passe par
      # le traefik de l'hôte, sans dépendre du DNS ni d'un aller-retour par la box.
      - "portabase.cineplex.fr:host-gateway"
    networks:
      - default
      - silo
      - sure

volumes:
  agent-data:

networks:
  # Réseaux internes des apps dont on sauvegarde la base PostgreSQL
  silo:
    name: silo_default
    external: true
  sure:
    name: sure_default
    external: true
