# Tautulli : statistiques Plex, exposé par traefik sur tautulli.cineplex.fr (accès privé).

x-host-path: &host-path
  type: bind
  bind:
    # Erreur si le dossier n'existe pas, au lieu de démarrer sur un dossier vide
    create_host_path: false

services:
  tautulli:
    image: tautulli/tautulli:v2.15.2
    container_name: tautulli
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1001
      TZ: Europe/Paris
    volumes:
      # Chemin absolu sur l'hôte, hors du clone git (sinon perdu au redéploiement)
      - <<: *host-path
        source: ${TAUTULLI_HOST_DIR:?TAUTULLI_HOST_DIR non défini}/data
        target: /config
      - <<: *host-path
        source: ${TAUTULLI_HOST_DIR:?TAUTULLI_HOST_DIR non défini}/data
        target: /logs
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      - "traefik.http.routers.tautulli.rule=Host(`tautulli.cineplex.fr`)"
      - "traefik.http.routers.tautulli.entrypoints=websecure"
      - "traefik.http.routers.tautulli.tls=true"
      - "traefik.http.routers.tautulli.tls.certresolver=ovh-resolver"
      - "traefik.http.routers.tautulli.service=tautulli-service"
      - "traefik.http.services.tautulli-service.loadbalancer.server.port=8181"

networks:
  traefik_proxy:
    external: true
