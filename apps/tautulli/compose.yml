# Tautulli : statistiques Plex, exposé par traefik sur tautulli.cineplex.fr.
# Newsletter et images publiques, le reste limité au LAN (middleware tautulli-whitelist,
# défini dans infra/traefik/config/dynamic.yaml).

x-host-path: &host-path
  type: bind
  bind:
    # Erreur si le dossier n'existe pas, au lieu de démarrer sur un dossier vide
    create_host_path: false

services:
  tautulli:
    image: tautulli/tautulli:v2.15.2
    container_name: tautulli
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1001
      TZ: Europe/Paris
    volumes:
      # Chemin absolu sur l'hôte, hors du clone git (sinon perdu au redéploiement)
      - <<: *host-path
        source: ${TAUTULLI_HOST_DIR:?TAUTULLI_HOST_DIR non défini}/data
        target: /config
      - <<: *host-path
        source: ${TAUTULLI_HOST_DIR:?TAUTULLI_HOST_DIR non défini}/data
        target: /logs
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # Route publique (newsletter et images)
      - "traefik.http.routers.tautulli-public.rule=Host(`tautulli.cineplex.fr`) && (PathPrefix(`/newsletter`) || PathPrefix(`/image`))"
      - "traefik.http.routers.tautulli-public.entrypoints=websecure"
      - "traefik.http.routers.tautulli-public.tls=true"
      - "traefik.http.routers.tautulli-public.tls.certresolver=ovh-resolver"
      - "traefik.http.routers.tautulli-public.priority=100"
      - "traefik.http.routers.tautulli-public.service=tautulli-service"

      # Route privée (tout le reste, LAN uniquement)
      - "traefik.http.routers.tautulli-private.rule=Host(`tautulli.cineplex.fr`)"
      - "traefik.http.routers.tautulli-private.entrypoints=websecure"
      - "traefik.http.routers.tautulli-private.tls=true"
      - "traefik.http.routers.tautulli-private.tls.certresolver=ovh-resolver"
      - "traefik.http.routers.tautulli-private.priority=10"
      - "traefik.http.routers.tautulli-private.middlewares=tautulli-whitelist@file"
      - "traefik.http.routers.tautulli-private.service=tautulli-service"

      - "traefik.http.services.tautulli-service.loadbalancer.server.port=8181"

networks:
  traefik_proxy:
    external: true
