# Tracearr : suivi des comptes Plex, exposé par traefik sur tracearr.cineplex.fr.
# Image "supervised" : postgres et redis embarqués dans le conteneur.
# Le nom de projet "tracearr" doit rester inchangé : les volumes s'appellent tracearr_tracearr_*.
services:
  tracearr:
    image: ghcr.io/connorgallopo/tracearr:supervised-3.1.3
    restart: unless-stopped
    shm_size: 256mb  # Mémoire partagée nécessaire à postgres
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: info
    volumes:
      - tracearr_postgres:/data/postgres
      - tracearr_redis:/data/redis
      - tracearr_data:/data/tracearr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      # Nom réel du réseau créé par le projet traefik
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.tracearr.rule=Host(`tracearr.cineplex.fr`)"
      - "traefik.http.routers.tracearr.entrypoints=websecure"
      - "traefik.http.routers.tracearr.tls=true"
      - "traefik.http.routers.tracearr.tls.certresolver=ovh-resolver"
      - "traefik.http.services.tracearr-service.loadbalancer.server.port=3000"

networks:
  traefik_proxy:
    external: true

volumes:
  tracearr_postgres:
  tracearr_redis:
  tracearr_data:
