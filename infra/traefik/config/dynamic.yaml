# Config dynamique de traefik : coller ici le contenu de /opt/traefik/config/dynamic.yaml.
http:
  serversTransports:
    ignore-nas-ssl:
      insecureSkipVerify: true

  services:
    nas-service:
      loadBalancer:
        serversTransport: ignore-nas-ssl
        servers:
          - url: "http://192.168.1.110:5000"

  routers:
    nas-router:
      rule: "Host(`dsm-fr.cineplex.fr`)"
      entryPoints:
        - websecure
      service: nas-service
      tls:
        certResolver: ovh-resolver