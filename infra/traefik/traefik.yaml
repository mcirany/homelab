api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"    # Localhost
        - "172.18.0.0/16"

certificatesResolvers:
  ovh-resolver:
    acme:
      email: contact@cineplex.fr
      storage: acme.json
      dnsChallenge:
        provider: ovh
        delayBeforeCheck: 0

log:
  level: DEBUG
  format: json

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/config/
    watch: true