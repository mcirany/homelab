# Déploiements du serveur "srvfr01".
# Lu par l'instance doco-cd de ce serveur (POLL_CONFIG -> target: srvfr01).
# Un document YAML (séparé par ---) = un projet compose.
name: traefik
working_dir: infra/traefik
environment:
  # Chemin absolu sur l'hôte, hors du clone git (sinon perdu au redéploiement)
  TRAEFIK_HOST_DIR: /opt/infra/traefik
destroy: false
---
name: seer
working_dir: apps/seer
environment:
  SEER_HOST_DIR: /opt/apps/seer
destroy: false
---
# Plex : ACTIF ici (inactif sur srvgp01, voir .doco-cd.srvgp01.yml).
# Pour basculer : passer destroy.enabled à true ici et à false sur l'autre serveur.
name: plex
working_dir: apps/plex
environment:
  PLEX_HOST_DIR: /opt/apps/plex
destroy:
  enabled: false
  remove_volumes: false
  remove_images: false
